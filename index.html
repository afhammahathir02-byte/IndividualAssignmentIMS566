<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library Login</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<!-- Google Font --> 
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Roboto', sans-serif;
}

/* Card design */
.card-login {
    width: 800px;
    border-radius: 15px;
}

/* Background overlay (optional kalau guna Vanta) */
#vartabg {
    height: 100vh;
}
</style>

</head>

<body id="vartabg">

<div class="d-flex justify-content-center align-items-center vh-100">
    
    <div class="card shadow card-login">
        <div class="card-body p-4">

            <div class="row">

                <!-- LEFT SIDE -->
                <div class="col-md-6 border-end d-flex align-items-center justify-content-center">
                    <div class="text-center">
                        <i class="bi bi-book fs-1 text-primary"></i>
                        <h4 class="mt-2">Library System</h4>
                        <p class="text-muted">Welcome back 👋</p>
                    </div>
                </div>

                <!-- RIGHT SIDE -->
                <div class="col-md-6">

                    <h5 class="text-center mb-4">LOGIN</h5>

                    <form onsubmit="return login()">

                        <label><i class="bi bi-envelope"></i> Email</label>
                        <input type="text" id="email" class="form-control mb-3" placeholder="Enter email">

                        <label><i class="bi bi-lock"></i> Password</label>
                        <input type="password" id="password" class="form-control mb-3" placeholder="Enter password">

                        <p id="error" class="text-danger text-center"></p>

                        <button class="btn btn-primary w-100">Login</button>

                    </form>

                </div>

            </div>

        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- Vanta Background -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js"></script>

<script>
VANTA.BIRDS({
  el: "#vartabg",
  mouseControls: true,
  touchControls: true,
  gyroControls: false,
  minHeight: 200,
  minWidth: 200,
  scale: 1,
  scaleMobile: 1
});
</script>

<!-- LOGIN FUNCTION -->
<script>
function login(){

    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value.trim();
    let error = document.getElementById("error");

    // validation kosong
    if(email === "" || password === ""){
        error.innerText = "Please fill in all fields!";
        return false;
    }

    // dummy login (assignment requirement)
    if(email === "admin" && password === "1234"){
        window.location.href = "dashboard.php";
        return false;
    } 
    else{
        error.innerText = "Invalid email or password!";
        return false;
    }
}
</script>

</body>
</html>
