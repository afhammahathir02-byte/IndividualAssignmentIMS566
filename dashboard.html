<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style1.css">
</head>

<body>

<!-- 🔵 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a href="dashboard.html" class="navbar-brand fw-bold">
    📖 <span class="ms-2 fw-bold">Library System</span>
</a>

        <div class="ms-auto">
            <a href="dashboard.html" class="btn btn-light btn-sm me-2">Dashboard</a>
            <a href="books.html" class="btn btn-light btn-sm me-2">Books</a>
            <a href="history.html" class="btn btn-light btn-sm me-2">History</a>
            <a href="myprofile.html" class="btn btn-light btn-sm">Profile</a>
            <a href="index.html" class="btn btn-danger btn-sm">Logout</a>
            <button onclick="toggleDarkMode()" id="darkBtn" class="btn btn-dark btn-sm">🌙
</button>
        </div>
    </div>
</nav>

<script>
function toggleDarkMode(){

    document.body.classList.toggle("dark-mode");

    if(document.body.classList.contains("dark-mode")){
        localStorage.setItem("darkMode","enabled");
    } else {
        localStorage.setItem("darkMode","disabled");
    }
}

window.onload = function(){

    if(localStorage.getItem("darkMode") === "enabled"){
        document.body.classList.add("dark-mode");
    }
}
</script>

<div class="container mt-4">

<!-- 🔷 CONTENT -->
<div class="container mt-4">

    <h3 class="mb-4">Welcome, Afham 👋</h3>
    

    <!-- 📊 CARDS -->
    <div class="row text-center">

        <div class="col-md-4 mb-3">
            <div class="card shadow p-3">
                <i class="bi bi-book fs-1 text-primary"></i>
                <h5>Total Books</h5>
                <h3>12</h3>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card shadow p-3">
                <i class="bi bi-person-check fs-1 text-success"></i>
                <h5>Borrowed</h5>
                <h3>6</h3>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card shadow p-3">
                <i class="bi bi-check-circle fs-1 text-warning"></i>
                <h5>Available</h5>
                <h3>6</h3>
            </div>
        </div>

    </div>

    <!-- 📈 CHART -->
    <div class="card shadow p-4 mt-4">
        <h5 class="mb-3">Library Overview</h5>
        <canvas id="myChart"></canvas>
    </div>

</div>

<footer class="footer mt-5">

<div class="container">

<div class="row">

    <!-- Footer -->
    <div class="col-md-6">

        </p>

        <p class="small mb-0">

        </p>
    </div>

</div>

<hr>

<div class="text-center pt-2">
        <p class="mb-0 fw-bold">
            Developed by Muhammad Afham
        </p>
    </div>

</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const ctx = document.getElementById('myChart');

new Chart(ctx, {
    type: 'bar',
    data: {
        labels: ['Total Books', 'Borrowed', 'Available'],
        datasets: [{
            label: 'Library Data',
            data: [100, 40, 60],
            borderWidth: 1
        }]
    }
});
</script>
